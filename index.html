<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>たした</title>
<meta name="description" content="積み重ねた時間が、かたちになる。個人用の「あゆみ」ポートレート">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b12">
<meta name="color-scheme" content="dark light">

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="たした">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div id="app">

  <header class="app-header">
    <div class="brand">
      <img class="logo-mark" src="./icon.svg" alt="" width="30" height="30">
      <span class="brand-name">たした</span>
      <span class="brand-sub">私のあゆみ</span>
    </div>
    <div class="header-actions">
      <button class="ghost-btn" id="pause-btn" type="button">⏸ 動きを止める</button>
      <button class="icon-btn" id="settings-btn" type="button" aria-label="設定">⚙</button>
    </div>
  </header>

  <main class="content">
    <section class="hero-card">
      <p class="hero-eyebrow">A LIVING PORTRAIT</p>
      <h1 class="hero-title">私の、現在形。</h1>
      <p class="hero-subtitle">歩んだ時間が、かたちになる。</p>

      <div class="hero-visual">
        <div class="hero-glow" id="hero-glow"></div>
        <canvas id="hero-canvas" aria-hidden="true"></canvas>
      </div>

      <p class="hero-caption"><span class="dot" id="week-dot"></span><span id="week-caption">今日はまだ空。ぽいっとでいい。</span></p>

      <div class="stat-grid">
        <div class="stat">
          <div class="stat-label">積み重ねた時間</div>
          <div class="stat-value" id="stat-total">0<span class="unit">時間</span>0<span class="unit">分</span></div>
        </div>
        <div class="stat">
          <div class="stat-label">これまでの「やった」</div>
          <div class="stat-value" id="stat-count">0<span class="unit">件</span></div>
        </div>
        <div class="stat">
          <div class="stat-label">直近7日間</div>
          <div class="stat-value" id="stat-week">0<span class="unit">時間</span>0<span class="unit">分</span></div>
        </div>
      </div>

      <div class="cat-bar" id="cat-bar"></div>
      <div class="cat-legend" id="cat-legend"></div>

      <div class="add-row">
        <button class="text-link" id="open-add-modal" type="button">他のカテゴリで足す</button>
        <button class="pill-btn" id="quick-add-btn" type="button">＋ 30分たす</button>
      </div>
    </section>

    <section class="history-card">
      <h2 class="history-title">最近の記録</h2>
      <div id="history-list"></div>
    </section>
  </main>

</div>

<div id="toast" role="status" aria-live="polite"></div>

<div id="update-banner">
  <span>新しい版があります</span>
  <button id="update-reload-btn" type="button">再読み込み</button>
</div>

<div class="install-hint" id="install-hint" hidden>
  <span>ホーム画面に追加できます。</span>
  <button class="btn primary install-action" type="button" style="min-height:32px;padding:6px 12px;font-size:12px;">追加</button>
  <button class="dismiss" type="button" aria-label="閉じる">×</button>
</div>

<div class="modal-overlay" id="add-overlay">
  <div class="modal-sheet" role="dialog" aria-modal="true" aria-label="時間を足す">
    <button class="icon-btn close-modal" id="close-add" type="button" aria-label="閉じる">×</button>
    <h2>時間を足す</h2>

    <div class="modal-section">
      <label class="field-label" for="add-category">カテゴリ</label>
      <input type="text" id="add-category" list="category-options" placeholder="例: 創作、仕事、家庭…" autocomplete="off">
      <datalist id="category-options"></datalist>
    </div>

    <div class="modal-section">
      <label class="field-label">時間</label>
      <div class="minute-chips" id="minute-chips">
        <button type="button" class="chip-btn" data-minutes="15">15分</button>
        <button type="button" class="chip-btn active" data-minutes="30">30分</button>
        <button type="button" class="chip-btn" data-minutes="60">60分</button>
      </div>
      <input type="number" id="add-minutes" min="1" step="1" value="30" inputmode="numeric">
    </div>

    <button class="btn primary" id="submit-add" type="button" style="width:100%;">たす</button>
  </div>
</div>

<div class="modal-overlay" id="settings-overlay">
  <div class="modal-sheet" role="dialog" aria-modal="true" aria-label="設定">
    <button class="icon-btn close-modal" id="close-settings" type="button" aria-label="閉じる">×</button>
    <h2>設定</h2>

    <div class="modal-section">
      <h3>バックアップ</h3>
      <div class="modal-row">
        <span id="last-backup-info">まだバックアップしていません</span>
      </div>
      <div class="modal-row">
        <button class="btn primary" id="export-json-btn" type="button">JSONを書き出す</button>
      </div>
      <div class="modal-row" style="display:block;">
        <div class="import-mode">
          <label><input type="radio" name="import-mode" value="merge" checked> 追記マージ</label>
          <label><input type="radio" name="import-mode" value="replace"> 置換</label>
        </div>
        <label class="btn" style="display:block;text-align:center;">
          JSONを読み込む
          <input type="file" id="import-file" accept="application/json,.json" style="display:none;">
        </label>
      </div>
    </div>

    <div class="modal-section">
      <h3>アプリ情報</h3>
      <div class="modal-row">
        <span id="version-label">バージョン</span>
      </div>
    </div>

    <div class="modal-section">
      <h3>危険な操作</h3>
      <div class="modal-row">
        <button class="btn danger" id="delete-all-btn" type="button">すべて削除</button>
      </div>
    </div>
  </div>
</div>

<script src="./js/scene.js"></script>
<script src="./js/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>たした</title>
<meta name="description" content="話したこと・やったことを、ぽいっと投げるだけで残す個人用ノート">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b12">
<meta name="color-scheme" content="dark light">

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="たした">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div id="app">

  <header class="app-header">
    <img class="logo-mark" src="./icon.svg" alt="" width="34" height="34">
    <div class="brand">
      <span class="brand-name">たした</span>
      <span class="brand-tagline">ぽいっと投げると、残る。</span>
    </div>
    <div class="header-spacer"></div>
    <button class="icon-btn" id="settings-btn" type="button" aria-label="設定">⚙</button>
  </header>

  <nav class="tabs" aria-label="表示切替">
    <button class="tab-btn active" data-view="today" type="button">今日</button>
    <button class="tab-btn" data-view="stack" type="button">積む</button>
    <button class="tab-btn" data-view="task" type="button">課題</button>
    <button class="tab-btn" data-view="all" type="button">全部</button>
  </nav>

  <main class="content" id="content"></main>

  <div class="install-hint" id="install-hint" hidden>
    <span>ホーム画面に追加できます。</span>
    <button class="btn primary install-action" type="button" style="min-height:32px;padding:6px 12px;font-size:12px;">追加</button>
    <button class="dismiss" type="button" aria-label="閉じる">×</button>
  </div>

  <footer class="composer">
    <div class="composer-row">
      <textarea id="composer-input" rows="1" placeholder="話したこと、やったこと、続きを書く…" aria-label="入力欄"></textarea>
      <button class="mic-btn" id="mic-btn" type="button" aria-label="音声入力">🎤</button>
      <button class="send-btn" id="send-btn" type="button" aria-label="ぽいっと投げる" disabled>ぽい</button>
    </div>
  </footer>

</div>

<div id="toast" role="status" aria-live="polite"></div>

<div id="update-banner">
  <span>新しい版があります</span>
  <button id="update-reload-btn" type="button">再読み込み</button>
</div>

<div class="modal-overlay" id="settings-overlay">
  <div class="modal-sheet" role="dialog" aria-modal="true" aria-label="設定">
    <button class="icon-btn close-modal" id="close-settings" type="button" aria-label="閉じる">×</button>
    <h2>設定</h2>

    <div class="modal-section">
      <h3>バックアップ</h3>
      <div class="modal-row">
        <span id="last-backup-info">まだバックアップしていません</span>
      </div>
      <div class="modal-row">
        <button class="btn primary" id="export-json-btn" type="button">JSONを書き出す</button>
      </div>
      <div class="modal-row" style="display:block;">
        <div class="import-mode">
          <label><input type="radio" name="import-mode" value="merge" checked> 追記マージ</label>
          <label><input type="radio" name="import-mode" value="replace"> 置換</label>
        </div>
        <label class="btn" style="display:block;text-align:center;">
          JSONを読み込む
          <input type="file" id="import-file" accept="application/json,.json" style="display:none;">
        </label>
      </div>
    </div>

    <div class="modal-section">
      <h3>アプリ情報</h3>
      <div class="modal-row">
        <span id="version-label">バージョン</span>
      </div>
    </div>

    <div class="modal-section">
      <h3>危険な操作</h3>
      <div class="modal-row">
        <button class="btn danger" id="delete-all-btn" type="button">すべて削除</button>
      </div>
    </div>
  </div>
</div>

<script src="./js/app.js"></script>
</body>
</html>
